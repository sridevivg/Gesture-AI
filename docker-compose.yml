services:
  postgres:
    image: postgres:15-alpine
    container_name: gesture_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gesture_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesture_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-gesture_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gesture_admin} -d ${POSTGRES_DB:-gesture_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gesture_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: gesture_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gesture_admin}:${POSTGRES_PASSWORD:-gesture_secure_password}@postgres:5432/${POSTGRES_DB:-gesture_ai}
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ML_SERVICE_HOST=ml
      - ML_SERVICE_PORT=8001
      - ENVIRONMENT=development
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    container_name: gesture_ml
    restart: unless-stopped
    environment:
      - ML_SERVICE_HOST=0.0.0.0
      - ML_SERVICE_PORT=8001
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./ml:/app/ml
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: gesture_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/api/v1/ws/gesture-stream
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
